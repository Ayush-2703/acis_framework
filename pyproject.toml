[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "acis-framework"
version = "1.0.0"
description = "Adversarial Construction Intelligence Security framework"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "scikit-learn>=1.3",
    "click>=8.1",
]

[project.optional-dependencies]
dashboard = ["pandas>=2.0", "streamlit>=1.32", "plotly>=5.18"]
torch = ["torch>=2.0"]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "flake8>=6.1"]
all = [
    "pandas>=2.0",
    "streamlit>=1.32",
    "plotly>=5.18",
    "torch>=2.0",
]

[project.scripts]
acis = "acis.cli.main:main"

[tool.setuptools.packages.find]
include = ["acis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
